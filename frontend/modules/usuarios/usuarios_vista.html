<div class="content-header pt-4">
    <div class="container-fluid d-flex justify-content-between align-items-center">
        <h1 class="m-0 dato-critico" style="font-size: 2.2rem;">Gestión de Usuarios</h1>
        <button class="btn btn-fox shadow-sm px-4" id="btnAbrirModalUsuario">
            <i class="fas fa-plus-circle mr-1"></i> Crear Nuevo Usuario
        </button>
    </div>
</div>

<section class="content mt-3">
    <div class="container-fluid">
        <div class="card shadow-sm border-0">
            <div class="card-header border-bottom-0 pt-3 pb-3 bg-light">
                <div class="input-group" style="max-width: 400px;">
                    <input type="text" id="busquedaUsuario" class="form-control"
                        placeholder="Buscar por nombre, usuario o perfil...">
                    <div class="input-group-append">
                        <span class="input-group-text"
                            style="background-color: var(--fox-surface); border-color: #cbd5e1; color: var(--fox-cyan);">
                            <i class="fas fa-search"></i>
                        </span>
                    </div>
                </div>
            </div>
            <div class="card-body p-0 table-responsive">
                <table class="table table-striped text-center align-middle mb-0">
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th class="text-left">Nombre Completo</th>
                            <th>Usuario</th>
                            <th>Correo</th>
                            <th>Perfil / Rol</th>
                            <th>Estado</th>
                            <th>Acciones</th>
                        </tr>
                    </thead>
                    <tbody id="tablaUsuarios">
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</section>

<div class="modal fade" id="modalUsuario" tabindex="-1" data-backdrop="static" data-keyboard="false">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content shadow-lg border-0">

            <div class="modal-header"
                style="background-color: var(--fox-surface); border-bottom: 3px solid var(--fox-cyan) !important;">
                <h5 class="modal-title font-weight-bold m-0" style="color: var(--fox-text-light);">
                    <i class="fas fa-user-shield mr-2" style="color: var(--fox-cyan);"></i> Datos del Usuario
                </h5>
                <button type="button" class="close" data-dismiss="modal"
                    style="color: var(--fox-text-light); opacity: 0.8;">&times;</button>
            </div>

            <form id="formUsuario" autocomplete="off">
                <div class="modal-body p-4 bg-white">
                    <div class="form-group mb-3">
                        <label class="small font-weight-bold text-uppercase mb-1"
                            style="color: var(--fox-text-gray);">Nombre Completo *</label>
                        <input type="text" id="usuNombre" class="form-control dato-critico" required
                            placeholder="Nombre y Apellidos" autocomplete="off">
                    </div>

                    <div class="row">
                        <div class="col-6 form-group mb-3">
                            <label class="small font-weight-bold text-uppercase mb-1"
                                style="color: var(--fox-text-gray);">Usuario (Login) *</label>
                            <input type="text" id="usuLogin" class="form-control dato-critico text-info" required
                                placeholder="Ej: fbernuy" autocomplete="one-time-code">
                        </div>
                        <div class="col-6 form-group mb-3">
                            <label class="small font-weight-bold text-uppercase mb-1"
                                style="color: var(--fox-text-gray);">Contraseña</label>
                            <input type="password" id="usuPwd" class="form-control font-weight-bold"
                                placeholder="••••••••" autocomplete="new-password">
                            <small id="pwdHelp" class="form-text text-muted font-weight-bold mt-1"
                                style="font-size: 0.7rem;">Mínimo 8 caracteres.</small>
                        </div>
                    </div>

                    <div class="form-group mb-3">
                        <label class="small font-weight-bold text-uppercase mb-1"
                            style="color: var(--fox-text-gray);">Correo Electrónico *</label>
                        <input type="email" id="usuCorreo" class="form-control font-weight-bold" required
                            placeholder="usuario@ejemplo.com" autocomplete="off">
                    </div>

                    <div class="form-group mb-0">
                        <label class="small font-weight-bold text-uppercase mb-1"
                            style="color: var(--fox-text-gray);">Perfil Asignado *</label>
                        <select id="usuRol" class="form-control dato-critico" required>
                            <option value="" disabled selected>Cargando perfiles...</option>
                        </select>
                    </div>
                </div>

                <div class="modal-footer px-4 border-top-0" style="background-color: var(--fox-surface);">
                    <button type="button" class="btn btn-secondary font-weight-bold mr-2"
                        data-dismiss="modal">Cancelar</button>
                    <button type="submit" id="btnGuardarUsuario" class="btn btn-fox px-4 shadow">
                        Guardar Usuario
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>
