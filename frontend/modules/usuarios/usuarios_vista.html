<div class="content-header pt-4">
    <div class="container-fluid d-flex justify-content-between align-items-center">
        <h1 class="m-0 font-weight-bold" style="color: var(--fox-dark);">Gestión de Usuarios</h1>
        <button class="btn btn-fox font-weight-bold shadow-sm px-4" id="btnAbrirModalUsuario">
            <i class="fas fa-plus-circle mr-1"></i> Crear Nuevo Usuario
        </button>
    </div>
</div>

<section class="content mt-3">
    <div class="container-fluid">
        <div class="card shadow-sm border-0">
            <div class="card-header bg-white border-bottom-0 pt-3">
                <input type="text" id="busquedaUsuario" class="form-control"
                    placeholder="Buscar por nombre, usuario o perfil...">
            </div>
            <div class="card-body p-0 table-responsive">
                <table class="table table-hover text-center align-middle mb-0">
                    <thead class="text-white font-weight-bold"
                        style="background-color: var(--fox-surface); white-space: nowrap;">
                        <tr>
                            <th>ID</th>
                            <th>Nombre Completo</th>
                            <th>Usuario</th>
                            <th>Correo</th>
                            <th>Perfil / Rol</th>
                            <th>Estado</th>
                            <th>Acciones</th>
                        </tr>
                    </thead>
                    <tbody id="tablaUsuarios">
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</section>

<div class="modal fade" id="modalUsuario" tabindex="-1" role="dialog" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content border-0 shadow-lg">
            <div class="modal-header border-bottom-0"
                style="background-color: #1a222b; border-bottom: 2px solid var(--fox-cyan) !important;">
                <h5 class="modal-title font-weight-bold text-white">
                    <i class="fas fa-user-shield mr-2 text-white"></i> Datos del Usuario
                </h5>
                <button type="button" class="close text-white" data-dismiss="modal"
                    style="outline: none; opacity: 1;">&times;</button>
            </div>
            <form id="formUsuario" autocomplete="off">
                <div class="modal-body bg-light">
                    <div class="form-group">
                        <label class="font-weight-bold text-dark">Nombre Completo</label>
                        <input type="text" id="usuNombre" class="form-control" required placeholder="Nombre y Apellidos"
                            autocomplete="off">
                    </div>
                    <div class="row">
                        <div class="col-6 form-group">
                            <label class="font-weight-bold text-dark">Usuario (Login)</label>
                            <input type="text" id="usuLogin" class="form-control" required placeholder="Ej: fbernuy"
                                autocomplete="one-time-code">
                        </div>
                        <div class="col-6 form-group">
                            <label class="font-weight-bold text-dark">Contraseña</label>
                            <input type="password" id="usuPwd" class="form-control" placeholder="••••••••"
                                autocomplete="new-password">
                            <small id="pwdHelp" class="form-text text-muted font-weight-bold">Mínimo 8
                                caracteres.</small>
                        </div>
                    </div>
                    <div class="form-group">
                        <label class="font-weight-bold text-dark">Correo Electrónico</label>
                        <input type="email" id="usuCorreo" class="form-control" required
                            placeholder="usuario@foxgamers.com" autocomplete="off">
                    </div>
                    <div class="form-group">
                        <label class="font-weight-bold text-dark">Perfil Asignado</label>
                        <select id="usuRol" class="form-control font-weight-bold" required
                            style="border-left: 4px solid var(--fox-cyan);">
                            <option value="">Cargando perfiles...</option>
                        </select>
                    </div>
                </div>
                <div class="modal-footer bg-white border-top-0">
                    <button type="button" class="btn btn-secondary shadow-sm" data-dismiss="modal">Cancelar</button>
                    <button type="submit" id="btnGuardarUsuario" class="btn btn-fox font-weight-bold px-4 shadow">
                        Guardar Usuario
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>
