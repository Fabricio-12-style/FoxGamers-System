<div class="content-header pt-4">
    <div class="container-fluid d-flex justify-content-between align-items-center">
        <h1 class="m-0 font-weight-bold" style="color: var(--fox-dark);">Directorio de Clientes</h1>
        <button class="btn btn-fox font-weight-bold shadow-sm px-4" id="btnCrearClienteModal">
            <i class="fas fa-plus-circle mr-1"></i> Crear Nuevo
        </button>
    </div>
</div>

<section class="content mt-3">
    <div class="container-fluid">
        <div class="card shadow-sm border-0" style="background-color: var(--fox-card);">
            <div class="card-header border-bottom-0 pt-3 pb-3">
                <div class="input-group">
                    <input type="text" id="buscarCliente" class="form-control"
                        placeholder="Buscar por documento o nombre...">
                    <div class="input-group-append">
                        <span class="input-group-text"
                            style="background-color: var(--fox-surface); border-color: #334155; color: var(--fox-cyan);">
                            <i class="fas fa-search"></i>
                        </span>
                    </div>
                </div>
            </div>

            <div class="card-body p-0 table-responsive">
                <table class="table table-hover text-center align-middle mb-0">
                    <thead class="text-white font-weight-bold" style="background-color: var(--fox-surface);">
                        <tr>
                            <th>ID</th>
                            <th>Documento</th>
                            <th class="text-left">Nombre / Razón Social</th>
                            <th>Teléfono</th>
                            <th>Correo</th>
                            <th>Dirección</th>
                            <th>Estado</th>
                            <th>Fecha Registro</th>
                            <th>Acciones</th>
                        </tr>
                    </thead>
                    <tbody id="tablaClientes">
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</section>

<div class="modal fade" id="modalCliente" tabindex="-1">
    <div class="modal-dialog modal-dialog-centered modal-lg">
        <div class="modal-content border-0 shadow-lg" style="background-color: var(--fox-card);">
            <div class="modal-header text-white" id="headerModalCliente"
                style="background-color: var(--fox-surface); border-bottom: 1px solid #334155;">
                <h5 class="modal-title font-weight-bold" id="tituloModalCliente">Nuevo Cliente</h5>
                <button type="button" class="close text-white" data-dismiss="modal">&times;</button>
            </div>

            <form id="formCliente">
                <div class="modal-body px-4" style="background-color: var(--fox-bg-dark);">

                    <div class="row">
                        <div class="col-md-4 form-group">
                            <label class="font-weight-bold small" style="color: var(--fox-text-light);">Tipo
                                documento</label>
                            <select id="cliTipoDoc" class="form-control login-input" required>
                                <option value="DNI">DNI (8 dígitos)</option>
                                <option value="RUC">RUC (11 dígitos)</option>
                                <option value="CE">CE (Carné Extranjería)</option>
                            </select>
                        </div>
                        <div class="col-md-8 form-group">
                            <label class="font-weight-bold small" style="color: var(--fox-text-light);">Número
                                documento</label>
                            <div class="input-group">
                                <input type="text" id="cliDocumento" class="form-control login-input"
                                    placeholder="Ingresa el número" required autocomplete="off">
                                <div class="input-group-append">
                                    <button type="button" class="btn btn-fox-support shadow-sm" id="btnConsultarDoc">
                                        <i class="fas fa-search mr-1"></i> Consultar
                                    </button>
                                </div>
                            </div>
                        </div>
                    </div>

                    <div class="form-group mt-2">
                        <label class="font-weight-bold small" style="color: var(--fox-text-light);">Nombre completo /
                            Razón Social</label>
                        <input type="text" id="cliNombre" class="form-control login-input"
                            placeholder="Se autocompleta al consultar" required>
                    </div>

                    <div class="row mt-2">
                        <div class="col-md-6 form-group">
                            <label class="font-weight-bold small" style="color: var(--fox-text-light);">Teléfono <span
                                    class="font-weight-normal text-muted">(opcional)</span></label>
                            <input type="text" id="cliTelefono" class="form-control login-input" placeholder="Teléfono">
                        </div>
                        <div class="col-md-6 form-group">
                            <label class="font-weight-bold small" style="color: var(--fox-text-light);">Correo <span
                                    class="font-weight-normal text-muted">(opcional)</span></label>
                            <input type="email" id="cliCorreo" class="form-control login-input"
                                placeholder="correo@ejemplo.com">
                        </div>
                    </div>

                    <div class="form-group mt-2 mb-0">
                        <label class="font-weight-bold small" style="color: var(--fox-text-light);">Dirección <span
                                class="font-weight-normal text-muted">(opcional)</span></label>
                        <input type="text" id="cliDireccion" class="form-control login-input" placeholder="Dirección">
                    </div>

                </div>

                <div class="modal-footer px-4 d-flex justify-content-end"
                    style="background-color: var(--fox-surface); border-top: 1px solid #334155;">
                    <button type="button" class="btn btn-logout font-weight-bold mr-2"
                        data-dismiss="modal">Cancelar</button>
                    <button type="submit" class="btn btn-fox font-weight-bold px-4"
                        id="btnGuardarCliente">Guardar</button>
                </div>
            </form>
        </div>
    </div>
</div>
