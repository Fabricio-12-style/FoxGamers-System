<script>
    if (!document.getElementById("app-content")) {
        window.location.replace("../../index.html");
    }
</script>

<div class="content-header pt-4">
    <div class="container-fluid d-flex justify-content-between align-items-center">
        <h1 class="m-0 dato-critico" style="font-size: 2.2rem;">Directorio de Clientes</h1>
        <button class="btn btn-fox shadow-sm px-4" id="btnCrearClienteModal">
            <i class="fas fa-plus-circle mr-1"></i> Crear Nuevo
        </button>
    </div>
</div>

<section class="content mt-3">
    <div class="container-fluid">
        <div class="card shadow-sm border-0">
            <div
                class="card-header border-bottom-0 pt-3 pb-3 bg-light d-flex justify-content-between align-items-center">
                <div class="input-group" style="max-width: 400px;">
                    <input type="text" id="buscarCliente" class="form-control"
                        placeholder="Buscar por documento o nombre en el hosting...">
                    <div class="input-group-append">
                        <span class="input-group-text"
                            style="background-color: var(--fox-surface); border-color: #cbd5e1; color: var(--fox-cyan);">
                            <i class="fas fa-search"></i>
                        </span>
                    </div>
                </div>
                <span class="badge badge-secondary p-2" style="font-size: 0.85rem;" id="lblModoCargaClientes">Mostrando
                    últimos 5</span>
            </div>

            <div class="card-body p-0 table-responsive">
                <table class="table table-striped text-center align-middle mb-0">
                    <thead>
                        <tr>
                            <th class="d-none d-md-table-cell">ID</th>
                            <th class="d-none d-md-table-cell">Documento</th>
                            <th class="text-left">Nombre / Razón Social</th>
                            <th class="d-none d-md-table-cell">Teléfono</th>
                            <th class="d-none d-md-table-cell">Correo</th>
                            <th class="d-none d-md-table-cell">Dirección</th>
                            <th class="d-none d-md-table-cell">Estado</th>
                            <th class="d-none d-md-table-cell">Fecha Registro</th>
                            <th class="d-none d-md-table-cell">Acciones</th>
                        </tr>
                    </thead>
                    <tbody id="tablaClientes"></tbody>
                </table>
            </div>
        </div>
    </div>
</section>

<div class="modal fade" id="modalCliente" tabindex="-1" data-backdrop="static" data-keyboard="false">
    <div class="modal-dialog modal-dialog-centered modal-lg">
        <div class="modal-content shadow-lg border-0">
            <div class="modal-header" id="headerModalCliente"
                style="background-color: var(--fox-surface); border-bottom: 3px solid var(--fox-cyan) !important;">
                <h5 class="modal-title font-weight-bold m-0" id="tituloModalCliente"
                    style="color: var(--fox-text-light);">
                    <i class="fas fa-user mr-2" style="color: var(--fox-cyan);"></i> Nuevo Cliente
                </h5>
                <button type="button" class="close" data-dismiss="modal"
                    style="color: var(--fox-text-light); opacity: 0.8;">&times;</button>
            </div>

            <form id="formCliente">
                <div class="modal-body p-4 bg-white">
                    <div class="row">
                        <div class="col-md-4 form-group">
                            <label class="small font-weight-bold text-uppercase mb-1"
                                style="color: var(--fox-text-gray);">Tipo Doc. *</label>
                            <select id="cliTipoDoc" class="form-control" required>
                                <option value="DNI">DNI (8 dígitos)</option>
                                <option value="RUC">RUC (11 dígitos)</option>
                                <option value="CE">CE (Carné Extranjería)</option>
                            </select>
                        </div>
                        <div class="col-md-8 form-group">
                            <label class="small font-weight-bold text-uppercase mb-1"
                                style="color: var(--fox-text-gray);">N° Documento *</label>
                            <div class="input-group">
                                <input type="text" id="cliDocumento" class="form-control dato-critico"
                                    placeholder="Ingresa el número" required autocomplete="off">
                                <div class="input-group-append">
                                    <button type="button" class="btn btn-fox-cyan font-weight-bold shadow-sm"
                                        id="btnConsultarDoc">
                                        <i class="fas fa-search mr-1"></i> Consultar
                                    </button>
                                </div>
                            </div>
                        </div>
                    </div>

                    <div class="form-group mt-2">
                        <label class="small font-weight-bold text-uppercase mb-1"
                            style="color: var(--fox-text-gray);">Nombre / Razón Social *</label>
                        <input type="text" id="cliNombre" class="form-control dato-critico" style="font-size: 1.1rem;"
                            placeholder="Se autocompleta al consultar" required>
                    </div>

                    <div class="row mt-2">
                        <div class="col-md-6 form-group">
                            <label class="small font-weight-bold text-uppercase mb-1"
                                style="color: var(--fox-text-gray);">Teléfono <span
                                    class="font-weight-normal text-muted">(Opcional)</span></label>
                            <input type="text" id="cliTelefono" class="form-control font-weight-bold"
                                placeholder="Ej: 999 888 777">
                        </div>
                        <div class="col-md-6 form-group">
                            <label class="small font-weight-bold text-uppercase mb-1"
                                style="color: var(--fox-text-gray);">Correo <span
                                    class="font-weight-normal text-muted">(Opcional)</span></label>
                            <input type="email" id="cliCorreo" class="form-control font-weight-bold"
                                placeholder="correo@ejemplo.com">
                        </div>
                    </div>

                    <div class="form-group mt-2 mb-0">
                        <label class="small font-weight-bold text-uppercase mb-1"
                            style="color: var(--fox-text-gray);">Dirección <span
                                class="font-weight-normal text-muted">(Opcional)</span></label>
                        <input type="text" id="cliDireccion" class="form-control font-weight-bold"
                            placeholder="Dirección del cliente">
                    </div>
                </div>

                <div class="modal-footer px-4 border-top-0" style="background-color: var(--fox-surface);">
                    <button type="button" class="btn btn-secondary font-weight-bold mr-2"
                        data-dismiss="modal">Cancelar</button>
                    <button type="submit" class="btn btn-fox px-5" id="btnGuardarCliente">
                        <i class="fas fa-save mr-2"></i> Guardar Cliente
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>
