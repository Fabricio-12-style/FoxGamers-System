<div class="content-header pt-4">
    <div class="container-fluid d-flex justify-content-between align-items-center">
        <h1 class="m-0 font-weight-bold" style="color: var(--fox-dark);">Gestión de Perfiles</h1>
        <button class="btn btn-fox font-weight-bold shadow-sm px-4" onclick="abrirModalCrear()">
            <i class="fas fa-plus-circle mr-1"></i> Crear Nuevo Perfil
        </button>
    </div>
</div>

<div class="modal fade" id="modalCrearPerfil" tabindex="-1">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content border-0 shadow">
            <div class="modal-header border-bottom-0"
                style="background-color: #1a222b; border-bottom: 2px solid var(--fox-cyan) !important;">
                <h5 class="modal-title font-weight-bold text-white">
                    <i class="fas fa-plus-circle mr-2 text-white"></i> Nuevo Perfil de Usuario
                </h5>
                <button type="button" class="close text-white" data-dismiss="modal" aria-label="Close"
                    style="outline: none; opacity: 1;">
                    <span aria-hidden="true">&times;</span>
                </button>
            </div>
            <form id="formCrearPerfil">
                <div class="modal-body">
                    <div class="form-group">
                        <label class="font-weight-bold">Nombre del Rol Comercial</label>
                        <select id="nuevoPerfNombre" class="form-control font-weight-bold" required>
                            <option value="" disabled selected>-- Selecciona un Rol Autorizado --</option>
                            <option value="Administrador">Administrador (Acceso Global)</option>
                            <option value="Supervisor">Supervisor de Tienda</option>
                            <option value="Vendedor">Vendedor / Cajero</option>
                            <option value="Almacenero">Almacenero / Logística</option>
                            <option value="Soporte Tecnico">Soporte Técnico de Hardware</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label class="font-weight-bold">Descripción de Funciones</label>
                        <textarea id="nuevoPerfDesc" class="form-control" rows="3"
                            placeholder="Define qué responsabilidades tendrá este perfil..."></textarea>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-dismiss="modal">Cancelar</button>
                    <button type="submit" class="btn btn-fox font-weight-bold px-4">Registrar Perfil</button>
                </div>
            </form>
        </div>
    </div>
</div>

<section class="content mt-3">
    <div class="container-fluid">
        <div class="card shadow-sm border-0">
            <div class="card-header bg-white border-bottom-0 pt-3">
                <input type="text" id="busquedaPerfil" class="form-control" placeholder="Buscar perfil por nombre...">
            </div>
            <div class="card-body p-0 table-responsive">
                <table class="table table-hover text-center align-middle mb-0">
                    <thead class="text-white font-weight-bold"
                        style="background-color: var(--fox-surface); white-space: nowrap;">
                        <tr>
                            <th>ID</th>
                            <th>Nombre del Perfil</th>
                            <th>Descripción</th>
                            <th>Estado</th>
                            <th>Fecha Creación</th>
                            <th>Acciones</th>
                        </tr>
                    </thead>
                    <tbody id="tablaPerfiles">
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</section>

<div class="modal fade" id="modalPermisos" tabindex="-1">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content border-0 shadow-lg">
            <div class="modal-header text-white" style="background-color: #007bff;">
                <h5 class="modal-title font-weight-bold"><i class="fas fa-shield-alt mr-2"></i> Configurar Accesos</h5>
                <button type="button" class="close text-white" data-dismiss="modal">&times;</button>
            </div>
            <div class="modal-body bg-white">
                <div class="text-center mb-3">
                    <h5 id="lblPermisoTitulo" class="font-weight-bold text-dark mb-1">Nombre del Perfil</h5>
                    <span id="lblPermisoRol" class="badge px-3 py-2 mt-1 shadow-sm">ROL</span>
                </div>
                <hr>
                <form id="formGestionPermisos">
                    <p class="text-muted small font-weight-bold mb-3">Selecciona los módulos permitidos:</p>
                    <div class="row" id="contenedorPermisos">
                    </div>
                </form>
            </div>
            <div class="modal-footer bg-light">
                <button type="button" class="btn btn-secondary" data-dismiss="modal">Cancelar</button>
                <button type="submit" form="formGestionPermisos"
                    class="btn btn-primary font-weight-bold shadow-sm px-4">
                    <i class="fas fa-save mr-1"></i> Guardar Permisos
                </button>
            </div>
        </div>
    </div>
</div>

<div class="modal fade" id="modalEditarPerfil" tabindex="-1">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content border-0 shadow">
            <div class="modal-header bg-warning text-white">
                <h5 class="modal-title font-weight-bold"><i class="fas fa-edit mr-2"></i> Editar Perfil</h5>
                <button type="button" class="close" data-dismiss="modal">&times;</button>
            </div>
            <form id="formEditarPerfil">
                <div class="modal-body">
                    <div class="form-group">
                        <label class="font-weight-bold">Nombre del Rol Comercial</label>
                        <select id="editPerfNombre" class="form-control font-weight-bold" required>
                            <option value="Administrador">Administrador (Acceso Global)</option>
                            <option value="Supervisor">Supervisor de Tienda</option>
                            <option value="Vendedor">Vendedor / Cajero</option>
                            <option value="Almacenero">Almacenero / Logística</option>
                            <option value="Soporte Tecnico">Soporte Técnico de Hardware</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label class="font-weight-bold">Descripción de Funciones</label>
                        <textarea id="editPerfDesc" class="form-control" rows="3"></textarea>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="submit" class="btn btn-warning font-weight-bold w-100 text-white">Guardar
                        Cambios</button>
                </div>
            </form>
        </div>
    </div>
</div>
