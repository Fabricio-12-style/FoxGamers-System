<script>
    if (!document.getElementById("app-content")) {
        window.location.replace("../../index.html");
    }
</script>

<div class="content-header pt-4">
    <div class="container-fluid d-flex justify-content-between align-items-center">
        <h1 class="m-0 dato-critico" style="font-size: 2.2rem;">Gestión de Proveedores</h1>
        <button class="btn btn-fox shadow-sm px-4" onclick="abrirModalNuevo()">
            <i class="fas fa-plus-circle mr-1"></i> Registrar Proveedor
        </button>
    </div>
</div>

<section class="content mt-3">
    <div class="container-fluid">
        <div class="card shadow-sm border-0">
            <div class="card-header border-bottom-0 pt-3 pb-3 bg-light">
                <div class="input-group" style="max-width: 400px;">
                    <input type="text" id="buscarProveedor" class="form-control"
                        placeholder="Buscar por RUC, Razón Social o Contacto...">
                    <div class="input-group-append">
                        <span class="input-group-text"
                            style="background-color: var(--fox-surface); border-color: #cbd5e1; color: var(--fox-cyan);">
                            <i class="fas fa-search"></i>
                        </span>
                    </div>
                </div>
            </div>

            <div class="card-body p-0 table-responsive">
                <table class="table table-striped text-center align-middle mb-0" style="font-size: 0.9rem;">
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th class="text-left">Nombre / Razón Social</th>
                            <th>RUC</th>
                            <th>Representante</th>
                            <th>Teléfono</th>
                            <th>Correo</th>
                            <th class="text-left">Dirección</th>
                            <th>Estado</th>
                            <th>Fecha Registro</th>
                            <th>Acciones</th>
                        </tr>
                    </thead>
                    <tbody id="tablaProveedores">
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</section>

<div class="modal fade" id="modalProveedor" tabindex="-1" data-backdrop="static" data-keyboard="false">
    <div class="modal-dialog modal-dialog-centered modal-lg">
        <div class="modal-content shadow-lg border-0">

            <div class="modal-header"
                style="background-color: var(--fox-surface); border-bottom: 3px solid var(--fox-cyan) !important;">
                <h5 class="modal-title font-weight-bold m-0" id="tituloModalProveedor"
                    style="color: var(--fox-text-light);">
                    <i class="fas fa-truck mr-2" style="color: var(--fox-cyan);"></i> Nuevo Proveedor
                </h5>
                <button type="button" class="close" data-dismiss="modal"
                    style="color: var(--fox-text-light); opacity: 0.8;">&times;</button>
            </div>

            <form id="formProveedor">
                <input type="hidden" id="provId">
                <div class="modal-body p-4 bg-white">

                    <div class="row">
                        <div class="col-md-4 form-group mb-3">
                            <label class="small font-weight-bold text-uppercase mb-1"
                                style="color: var(--fox-text-gray);">RUC *</label>
                            <input type="text" id="provRUC" class="form-control dato-critico" maxlength="11"
                                onkeypress="return event.charCode >= 48 && event.charCode <= 57" required>
                        </div>
                        <div class="col-md-8 form-group mb-3">
                            <label class="small font-weight-bold text-uppercase mb-1"
                                style="color: var(--fox-text-gray);">Razón Social *</label>
                            <input type="text" id="provRazonSocial" class="form-control dato-critico"
                                style="font-size: 1.1rem;" required>
                        </div>
                    </div>

                    <div class="form-group mb-3">
                        <label class="small font-weight-bold text-uppercase mb-1"
                            style="color: var(--fox-text-gray);">Dirección Principal</label>
                        <input type="text" id="provDireccion" class="form-control font-weight-bold">
                    </div>

                    <div class="row">
                        <div class="col-md-6 form-group mb-3">
                            <label class="small font-weight-bold text-uppercase mb-1"
                                style="color: var(--fox-text-gray);">Nombre del Contacto</label>
                            <input type="text" id="provContacto" class="form-control font-weight-bold"
                                placeholder="Ej. Juan Pérez">
                        </div>
                        <div class="col-md-6 form-group mb-3">
                            <label class="small font-weight-bold text-uppercase mb-1"
                                style="color: var(--fox-text-gray);">Teléfono / WhatsApp</label>
                            <input type="text" id="provTelefono" class="form-control font-weight-bold" maxlength="9"
                                onkeypress="return event.charCode >= 48 && event.charCode <= 57">
                        </div>
                    </div>

                    <div class="form-group mb-0">
                        <label class="small font-weight-bold text-uppercase mb-1"
                            style="color: var(--fox-text-gray);">Correo Electrónico</label>
                        <input type="email" id="provCorreo" class="form-control font-weight-bold">
                    </div>

                </div>

                <div class="modal-footer border-top-0 px-4" style="background-color: var(--fox-surface);">
                    <button type="button" class="btn btn-secondary font-weight-bold px-4"
                        data-dismiss="modal">Cancelar</button>
                    <button type="submit" class="btn btn-fox px-5">
                        <i class="fas fa-save mr-2"></i> Guardar Cambios
                    </button>
                </div>
            </form>

        </div>
    </div>
</div>
