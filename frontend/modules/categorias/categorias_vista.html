<script>
    if (!document.getElementById("app-content")) {
        window.location.replace("../../index.html"); 
    }
</script>

<div class="content-header pt-4">
    <div class="container-fluid d-flex justify-content-between align-items-center">
        <h1 class="m-0 dato-critico" style="font-size: 2.2rem;">Categorías</h1>
        <button class="btn btn-fox shadow-sm px-4" id="btnCrearCategoriaModal">
            <i class="fas fa-plus-circle mr-1"></i> Nueva Categoría
        </button>
    </div>
</div>

<section class="content mt-3">
    <div class="container-fluid">
        <div class="card shadow-sm border-0">
            <div class="card-header border-bottom-0 pt-3 pb-3 bg-light">
                <div class="input-group" style="max-width: 400px;">
                    <input type="text" id="buscarCategoria" class="form-control"
                        placeholder="Buscar categoría por nombre...">
                    <div class="input-group-append">
                        <span class="input-group-text"
                            style="background-color: var(--fox-surface); border-color: #cbd5e1; color: var(--fox-cyan);">
                            <i class="fas fa-search"></i>
                        </span>
                    </div>
                </div>
            </div>

            <div class="card-body p-0 table-responsive">
                <table class="table table-striped text-center align-middle mb-0">
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th class="text-left">Nombre de Familia</th>
                            <th class="text-left">Descripción</th>
                            <th>Estado</th>
                            <th>Acciones</th>
                        </tr>
                    </thead>
                    <tbody id="tablaCategorias">
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</section>

<div class="modal fade" id="modalCategoria" tabindex="-1" data-backdrop="static" data-keyboard="false">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content shadow-lg border-0">

            <div class="modal-header"
                style="background-color: var(--fox-surface); border-bottom: 3px solid var(--fox-orange) !important;">
                <h5 class="modal-title font-weight-bold" id="tituloModalCategoria"
                    style="color: var(--fox-text-light);">Nueva Categoría</h5>
                <button type="button" class="close" data-dismiss="modal"
                    style="color: var(--fox-text-light); opacity: 0.8;">&times;</button>
            </div>

            <form id="formCategoria">
                <div class="modal-body px-4 p-4 bg-white">
                    <div class="form-group">
                        <label class="small font-weight-bold text-uppercase mb-1"
                            style="color: var(--fox-text-gray);">Nombre de la Familia *</label>
                        <input type="text" id="catNombre" class="form-control dato-critico"
                            placeholder="Ej: Teclados, Mouse, Monitores" required autocomplete="off">
                    </div>
                    <div class="form-group mt-4">
                        <label class="small font-weight-bold text-uppercase mb-1"
                            style="color: var(--fox-text-gray);">Descripción (Opcional)</label>
                        <textarea id="catDescripcion" class="form-control font-weight-bold" rows="3"
                            placeholder="Breve descripción de los productos en esta familia"></textarea>
                    </div>
                </div>

                <div class="modal-footer px-4 border-top-0" style="background-color: var(--fox-surface);">
                    <button type="button" class="btn btn-secondary font-weight-bold mr-2"
                        data-dismiss="modal">Cancelar</button>
                    <button type="submit" class="btn btn-fox px-4">
                        <i class="fas fa-save mr-2"></i> Guardar Familia
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>
