<div class="content-header pt-4">
    <div class="container-fluid d-flex justify-content-between align-items-center">
        <h1 class="m-0 font-weight-bold" style="color: var(--fox-dark);">Categorías</h1>
        <button class="btn btn-fox font-weight-bold shadow-sm px-4" id="btnCrearCategoriaModal">
            <i class="fas fa-plus-circle mr-1"></i> Nueva Categoría
        </button>
    </div>
</div>

<section class="content mt-3">
    <div class="container-fluid">
        <div class="card shadow-sm border-0" style="background-color: var(--fox-card);">
            <div class="card-header border-bottom-0 pt-3 pb-3">
                <div class="input-group">
                    <input type="text" id="buscarCategoria" class="form-control"
                        placeholder="Buscar categoría por nombre...">
                    <div class="input-group-append">
                        <span class="input-group-text"
                            style="background-color: var(--fox-surface); border-color: #334155; color: var(--fox-cyan);">
                            <i class="fas fa-search"></i>
                        </span>
                    </div>
                </div>
            </div>

            <div class="card-body p-0 table-responsive">
                <table class="table table-hover text-center align-middle mb-0">
                    <thead class="text-white font-weight-bold"
                        style="background-color: var(--fox-surface); white-space: nowrap;">
                        <tr>
                            <th>ID</th>
                            <th class="text-left">Nombre de Familia</th>
                            <th class="text-left">Descripción</th>
                            <th>Estado</th>
                            <th>Acciones</th>
                        </tr>
                    </thead>
                    <tbody id="tablaCategorias">
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</section>

<div class="modal fade" id="modalCategoria" tabindex="-1">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content border-0 shadow-lg" style="background-color: var(--fox-card);">
            <div class="modal-header text-white"
                style="background-color: var(--fox-surface); border-bottom: 1px solid #334155;">
                <h5 class="modal-title font-weight-bold" id="tituloModalCategoria">Nueva Categoría</h5>
                <button type="button" class="close text-white" data-dismiss="modal">&times;</button>
            </div>

            <form id="formCategoria">
                <div class="modal-body px-4" style="background-color: var(--fox-bg-dark);">
                    <div class="form-group">
                        <label class="font-weight-bold small" style="color: var(--fox-bg-dark);">Nombre de la
                            Familia</label>
                        <input type="text" id="catNombre" class="form-control login-input"
                            placeholder="Ej: Teclados, Mouse, Monitores" required autocomplete="off">
                    </div>
                    <div class="form-group mt-3">
                        <label class="font-weight-bold small" style="color: var(--fox-bg-dark);">Descripción
                            (Opcional)</label>
                        <textarea id="catDescripcion" class="form-control login-input" rows="3"
                            placeholder="Breve descripción de los productos en esta familia"></textarea>
                    </div>
                </div>

                <div class="modal-footer px-4"
                    style="background-color: var(--fox-surface); border-top: 1px solid #334155;">
                    <button type="button" class="btn btn-logout font-weight-bold mr-2"
                        data-dismiss="modal">Cancelar</button>
                    <button type="submit" class="btn btn-fox font-weight-bold px-4">Guardar Familia</button>
                </div>
            </form>
        </div>
    </div>
</div>
