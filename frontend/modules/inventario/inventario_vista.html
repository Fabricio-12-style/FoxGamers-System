<div class="content-header pt-4">
    <div class="container-fluid d-flex justify-content-between align-items-center">
        <h1 class="m-0 font-weight-bold" style="color: var(--fox-dark);">Gestión de Inventario</h1>
    </div>
</div>

<section class="content mt-3">
    <div class="container-fluid">
        <div class="card shadow-sm border-0" style="background-color: var(--fox-card);">
            <div class="card-header border-bottom-0 pt-3 pb-3">
                <input type="text" id="buscarInventario" class="form-control"
                    placeholder="Buscar producto o presentación...">
            </div>
            <div class="card-body p-0 table-responsive">
                <table class="table table-hover text-center align-middle mb-0">
                    <thead class="text-white font-weight-bold" style="background-color: var(--fox-surface);">
                        <tr>
                            <th>Imagen</th>
                            <th class="text-left">Producto</th>
                            <th class="text-left">Presentación</th>
                            <th>Stock Actual</th>
                            <th>Stock Mín.</th>
                            <th>P. Compra</th>
                            <th>P. Venta</th>
                            <th>Estado</th>
                            <th>Acciones</th>
                        </tr>
                    </thead>
                    <tbody id="tablaInventario"></tbody>
                </table>
            </div>
        </div>
    </div>
</section>

<div class="modal fade" id="modalAjusteStock" tabindex="-1" data-backdrop="static" data-keyboard="false">
    <div class="modal-dialog modal-dialog-centered modal-md">
        <div class="modal-content border-0 shadow-lg" style="background-color: var(--fox-bg-dark);">

            <div class="modal-header border-bottom-0" style="background-color: var(--fox-surface);">
                <h5 class="text-white font-weight-bold m-0">
                    <i class="fas fa-boxes text-info mr-2"></i> Movimiento de Stock
                </h5>
                <button type="button" class="close text-white" data-dismiss="modal">&times;</button>
            </div>

            <form id="formAjusteStock">
                <div class="modal-body p-4 text-white">

                    <div class="text-center mb-4 p-3 rounded shadow-sm"
                        style="background-color: var(--fox-card); border: 1px dashed var(--fox-cyan);">
                        <small class="text-muted text-uppercase font-weight-bold d-block mb-1">Producto a
                            modificar:</small>
                        <h6 id="lblProductoAjuste" class="font-weight-bold mb-2"
                            style="color: var(--fox-cyan); line-height: 1.4;">Cargando...</h6>
                        <div class="text-white-50 small">
                            Stock Actual: <strong id="lblStockActualAjuste" class="text-white"
                                style="font-size: 1.1rem;">0</strong>
                        </div>
                    </div>

                    <div class="row">
                        <div class="col-sm-6 mb-3">
                            <label class="small text-muted font-weight-bold text-uppercase mb-1">Tipo Movimiento
                                *</label>
                            <select id="ajusteTipo" class="form-control login-input font-weight-bold" required>
                                <option value="" disabled selected>-- Seleccione --</option>
                                <option value="ENTRADA" class="text-success">ENTRADA (+)</option>
                                <option value="SALIDA" class="text-danger">SALIDA (-)</option>
                            </select>
                        </div>
                        <div class="col-sm-6 mb-3">
                            <label class="small text-muted font-weight-bold text-uppercase mb-1">Motivo *</label>
                            <select id="ajusteMotivoSelect" class="form-control login-input" required disabled>
                                <option value="" disabled selected>-- Elija un Tipo --</option>
                            </select>
                        </div>
                    </div>

                    <div id="divAjusteProveedor" class="mb-3 d-none">
                        <label class="small text-muted font-weight-bold text-uppercase mb-1">Proveedor *</label>
                        <select id="ajusteProveedorSelect" class="form-control login-input">
                            <option value="" disabled selected>-- Seleccione Proveedor --</option>
                        </select>
                    </div>

                    <div class="row">
                        <div class="col-sm-6 mb-3">
                            <label class="small text-muted font-weight-bold text-uppercase mb-1">Cantidad *</label>
                            <input type="number" id="ajusteCantidad"
                                class="form-control login-input font-weight-bold text-white text-center" min="1"
                                placeholder="Ej: 5" required>
                        </div>
                        <div class="col-sm-6 mb-3">
                            <label class="small text-muted font-weight-bold text-uppercase mb-1">N° Documento</label>
                            <input type="text" id="ajusteDocumento" class="form-control login-input"
                                placeholder="Ej: F001-00456 (Opcional)">
                        </div>
                    </div>

                    <div class="mb-2">
                        <label class="small text-muted font-weight-bold text-uppercase mb-1">Observación /
                            Detalle</label>
                        <textarea id="ajusteObservacion" class="form-control login-input text-white" rows="2"
                            placeholder="Detalles de la garantía, estado físico del producto, etc..."></textarea>
                    </div>

                </div>

                <div class="modal-footer border-top-0 d-flex justify-content-end"
                    style="background-color: var(--fox-surface);">
                    <button type="button" class="btn btn-secondary font-weight-bold px-4"
                        data-dismiss="modal">Cancelar</button>
                    <button type="submit" class="btn btn-fox font-weight-bold px-4">
                        <i class="fas fa-save mr-2"></i> Registrar Movimiento
                    </button>
                </div>
            </form>

        </div>
    </div>
</div>

<div class="modal fade" id="modalKardex" tabindex="-1">
    <div class="modal-dialog modal-dialog-centered modal-lg">
        <div class="modal-content border-0 shadow-lg" style="background-color: var(--fox-card);">
            <div class="modal-header text-white"
                style="background-color: var(--fox-surface); border-bottom: 1px solid var(--fox-cyan);">
                <h5 class="modal-title font-weight-bold">Historial de Movimientos</h5>
                <button type="button" class="close text-white" data-dismiss="modal">&times;</button>
            </div>
            <div class="modal-body p-0">
                <div class="p-3 text-center" style="background-color: var(--fox-bg-dark);">
                    <h6 id="lblKardexProducto" class="font-weight-bold m-0" style="color: var(--fox-cyan);"></h6>
                </div>
                <div class="table-responsive" style="max-height: 400px;">
                    <table class="table table-hover text-center align-middle mb-0 small">
                        <thead class="text-white"
                            style="background-color: var(--fox-surface); position: sticky; top: 0;">
                            <tr>
                                <th>Fecha</th>
                                <th>Usuario</th>
                                <th>Tipo</th>
                                <th>Cant.</th>
                                <th>Motivo</th>
                            </tr>
                        </thead>
                        <tbody id="tablaKardex" style="background-color: #ffffff;"></tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
</div>
