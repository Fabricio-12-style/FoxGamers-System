<div class="content-header pt-4">
    <div class="container-fluid d-flex justify-content-between align-items-center">
        <h1 class="m-0 dato-critico" style="font-size: 2.2rem;">Gestión de Inventario</h1>
    </div>
</div>

<section class="content mt-3">
    <div class="container-fluid">
        <div class="card shadow-sm border-0">
            <div class="card-header border-bottom-0 pt-3 pb-3 bg-light">
                <input type="text" id="buscarInventario" class="form-control"
                    placeholder="Buscar producto o presentación...">
            </div>
            <div class="card-body p-0 table-responsive">
                <table class="table table-striped text-center align-middle mb-0">
                    <thead>
                        <tr>
                            <th>Imagen</th>
                            <th class="text-left">Producto</th>
                            <th class="text-left">Presentación</th>
                            <th>Stock Actual</th>
                            <th>Stock Mín.</th>
                            <th>P. Compra</th>
                            <th>P. Venta</th>
                            <th>Estado</th>
                            <th>Acciones</th>
                        </tr>
                    </thead>
                    <tbody id="tablaInventario"></tbody>
                </table>
            </div>
        </div>
    </div>
</section>
<div class="modal fade" id="modalAjusteStock" tabindex="-1" data-backdrop="static" data-keyboard="false">
    <div class="modal-dialog modal-dialog-centered modal-md">
        <div class="modal-content shadow-lg border-0">

            <div class="modal-header"
                style="background-color: var(--fox-surface); border-bottom: 3px solid var(--fox-cyan) !important;">
                <h5 class="modal-title font-weight-bold m-0" style="color: var(--fox-text-light);">
                    <i class="fas fa-boxes mr-2" style="color: var(--fox-cyan);"></i> Movimiento de Stock
                </h5>
                <button type="button" class="close" data-dismiss="modal"
                    style="color: var(--fox-text-light); opacity: 0.8;">&times;</button>
            </div>

            <form id="formAjusteStock">
                <div class="modal-body p-4 bg-white">

                    <div class="text-center mb-4 p-3 rounded"
                        style="border: 2px dashed var(--fox-cyan); background-color: #f8fafc;">
                        <small class="text-uppercase font-weight-bold d-block mb-1"
                            style="color: var(--fox-text-gray);">Producto a modificar:</small>
                        <h6 id="lblProductoAjuste" class="dato-critico mb-2"
                            style="color: var(--fox-cyan) !important; font-size: 1.1rem;">Cargando...</h6>
                        <div class="small font-weight-bold" style="color: var(--fox-text-gray);">
                            Stock Actual: <strong id="lblStockActualAjuste" class="dato-critico text-danger"
                                style="font-size: 1.2rem;">0</strong>
                        </div>
                    </div>

                    <div class="row">
                        <div class="col-sm-6 mb-3">
                            <label class="small font-weight-bold text-uppercase mb-1"
                                style="color: var(--fox-text-gray);">Tipo Movimiento *</label>
                            <select id="ajusteTipo" class="form-control" required>
                                <option value="" disabled selected>-- Seleccione --</option>
                                <option value="ENTRADA" class="text-success font-weight-bold">ENTRADA (+)</option>
                                <option value="SALIDA" class="text-danger font-weight-bold">SALIDA (-)</option>
                            </select>
                        </div>
                        <div class="col-sm-6 mb-3">
                            <label class="small font-weight-bold text-uppercase mb-1"
                                style="color: var(--fox-text-gray);">Motivo *</label>
                            <select id="ajusteMotivoSelect" class="form-control" required disabled>
                                <option value="" disabled selected>-- Elija un Tipo --</option>
                            </select>
                        </div>
                    </div>

                    <div id="divAjusteProveedor" class="mb-3 d-none">
                        <label class="small font-weight-bold text-uppercase mb-1"
                            style="color: var(--fox-text-gray);">Proveedor *</label>
                        <select id="ajusteProveedorSelect" class="form-control">
                            <option value="" disabled selected>-- Seleccione Proveedor --</option>
                        </select>
                    </div>

                    <div class="row">
                        <div class="col-sm-6 mb-3">
                            <label class="small font-weight-bold text-uppercase mb-1"
                                style="color: var(--fox-text-gray);">Cantidad *</label>
                            <input type="number" id="ajusteCantidad" class="form-control text-center dato-critico"
                                min="1" placeholder="Ej: 5" required>
                        </div>
                        <div class="col-sm-6 mb-3">
                            <label class="small font-weight-bold text-uppercase mb-1"
                                style="color: var(--fox-text-gray);">N° Documento</label>
                            <input type="text" id="ajusteDocumento" class="form-control font-weight-bold"
                                placeholder="Ej: F001-00456 (Opcional)">
                        </div>
                    </div>

                    <div class="mb-2">
                        <label class="small font-weight-bold text-uppercase mb-1"
                            style="color: var(--fox-text-gray);">Observación / Detalle</label>
                        <textarea id="ajusteObservacion" class="form-control font-weight-bold" rows="2"
                            placeholder="Detalles..."></textarea>
                    </div>

                </div>

                <div class="modal-footer border-top-0" style="background-color: var(--fox-surface);">
                    <button type="button" class="btn btn-secondary font-weight-bold px-4"
                        data-dismiss="modal">Cancelar</button>
                    <button type="submit" class="btn btn-fox px-4">
                        <i class="fas fa-save mr-2"></i> Registrar Movimiento
                    </button>
                </div>
            </form>

        </div>
    </div>
</div>

<div class="modal fade" id="modalKardex" tabindex="-1">
    <div class="modal-dialog modal-dialog-centered modal-lg">
        <div class="modal-content shadow-lg border-0">

            <div class="modal-header"
                style="background-color: var(--fox-surface); border-bottom: 3px solid var(--fox-cyan) !important;">
                <h5 class="modal-title font-weight-bold m-0" style="color: var(--fox-text-light);">Historial de
                    Movimientos</h5>
                <button type="button" class="close" data-dismiss="modal"
                    style="color: var(--fox-text-light); opacity: 0.8;">&times;</button>
            </div>

            <div class="modal-body p-0 bg-white">
                <div class="p-3 text-center" style="background-color: var(--fox-bg-dark);">
                    <h6 id="lblKardexProducto" class="font-weight-bold m-0"
                        style="color: var(--fox-cyan); font-size: 1.1rem; letter-spacing: 0.5px;"></h6>
                </div>

                <div class="table-responsive" style="max-height: 400px;">
                    <table class="table table-striped text-center align-middle mb-0">
                        <thead style="position: sticky; top: 0; z-index: 1;">
                            <tr>
                                <th>Fecha</th>
                                <th>Usuario</th>
                                <th>Tipo</th>
                                <th>Cant.</th>
                                <th class="text-left">Motivo</th>
                            </tr>
                        </thead>
                        <tbody id="tablaKardex"></tbody>
                    </table>
                </div>
            </div>

        </div>
    </div>
</div>
