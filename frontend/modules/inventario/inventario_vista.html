<div class="content-header pt-4">
    <div class="container-fluid d-flex justify-content-between align-items-center">
        <h1 class="m-0 font-weight-bold" style="color: var(--fox-dark);">Gestión de Inventario</h1>
    </div>
</div>

<section class="content mt-3">
    <div class="container-fluid">
        <div class="card shadow-sm border-0" style="background-color: var(--fox-card);">
            <div class="card-header border-bottom-0 pt-3 pb-3">
                <input type="text" id="buscarInventario" class="form-control"
                    placeholder="Buscar producto o presentación...">
            </div>
            <div class="card-body p-0 table-responsive">
                <table class="table table-hover text-center align-middle mb-0">
                    <thead class="text-white font-weight-bold" style="background-color: var(--fox-surface);">
                        <tr>
                            <th>Imagen</th>
                            <th class="text-left">Producto</th>
                            <th class="text-left">Presentación</th>
                            <th>Stock Actual</th>
                            <th>Stock Mín.</th>
                            <th>P. Compra</th>
                            <th>P. Venta</th>
                            <th>Estado</th>
                            <th>Acciones</th>
                        </tr>
                    </thead>
                    <tbody id="tablaInventario"></tbody>
                </table>
            </div>
        </div>
    </div>
</section>

<div class="modal fade" id="modalAjusteStock" tabindex="-1">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content border-0 shadow-lg" style="background-color: var(--fox-card);">
            <div class="modal-header text-white"
                style="background-color: var(--fox-surface); border-bottom: 1px solid #334155;">
                <h5 class="modal-title font-weight-bold w-100 text-center">Movimiento de Stock</h5>
                <button type="button" class="close text-white" data-dismiss="modal">&times;</button>
            </div>
            <form id="formAjusteStock">
                <div class="modal-body px-4 pt-4" style="background-color: var(--fox-bg-dark);">

                    <div class="text-center mb-4">
                        <small class="text-muted d-block text-uppercase font-weight-bold">Producto a modificar:</small>
                        <span id="lblProductoAjuste" class="h6 font-weight-bold" style="color: var(--fox-cyan);"></span>
                        <div class="mt-1 small text-white-50">Stock Actual: <span id="lblStockActualAjuste"
                                class="font-weight-bold text-white">0</span></div>
                    </div>

                    <div class="row">
                        <div class="col-md-6 form-group">
                            <label class="small text-muted font-weight-bold">Tipo Movimiento *</label>
                            <select id="ajusteTipo" class="form-control login-input" required>
                                <option value="" disabled selected>-- Seleccionar --</option>
                                <option value="ENTRADA">ENTRADA</option>
                                <option value="SALIDA">SALIDA</option>
                            </select>
                        </div>

                        <div class="col-md-6 form-group">
                            <label class="small text-muted font-weight-bold">Motivo *</label>
                            <select id="ajusteMotivoSelect" class="form-control login-input" required disabled>
                                <option value="" disabled selected>-- Elija un Tipo primero --</option>
                            </select>
                        </div>
                    </div>

                    <div class="form-group d-none" id="divAjusteProveedor">
                        <label class="small text-muted font-weight-bold">Proveedor Asociado *</label>
                        <select id="ajusteProveedorSelect" class="form-control login-input">
                            <option value="" disabled selected>Cargando proveedores...</option>
                        </select>
                    </div>
                    <div class="col-md-4 form-group">
                        <label class="small text-muted font-weight-bold">Cantidad *</label>
                        <input type="number" id="ajusteCantidad" class="form-control login-input" min="1"
                            onkeydown="return event.key !== '-' && event.key !== 'e' && event.key !== '.'" required>
                    </div>

                    <div class="col-md-8 form-group">
                        <label class="small text-muted font-weight-bold">N° Documento (Opcional)</label>
                        <input type="text" id="ajusteDocumento" class="form-control login-input"
                            placeholder="Ej: F001-00456">
                    </div>
                </div>

                <div class="form-group mb-0">
                    <label class="small text-muted font-weight-bold">Observación / Detalle</label>
                    <textarea id="ajusteObservacion" class="form-control login-input" rows="2"
                        placeholder="Detalles de la garantía, estado físico del producto, etc..."></textarea>
                </div>
        </div>

        <div class="modal-footer border-top-0 pt-3 pb-4 px-4" style="background-color: var(--fox-bg-dark);">
            <button type="button" class="btn btn-secondary" data-dismiss="modal">Cancelar</button>
            <button type="submit" class="btn btn-fox font-weight-bold">Registrar Movimiento</button>
        </div>

        </form>
    </div>
</div>
</div>

<div class="modal fade" id="modalKardex" tabindex="-1">
    <div class="modal-dialog modal-dialog-centered modal-lg">
        <div class="modal-content border-0 shadow-lg" style="background-color: var(--fox-card);">
            <div class="modal-header text-white"
                style="background-color: var(--fox-surface); border-bottom: 1px solid var(--fox-cyan);">
                <h5 class="modal-title font-weight-bold">Historial de Movimientos</h5>
                <button type="button" class="close text-white" data-dismiss="modal">&times;</button>
            </div>
            <div class="modal-body p-0">
                <div class="p-3 text-center" style="background-color: var(--fox-bg-dark);">
                    <h6 id="lblKardexProducto" class="font-weight-bold m-0" style="color: var(--fox-cyan);"></h6>
                </div>
                <div class="table-responsive" style="max-height: 400px;">
                    <table class="table table-hover text-center align-middle mb-0 small">
                        <thead class="text-white"
                            style="background-color: var(--fox-surface); position: sticky; top: 0;">
                            <tr>
                                <th>Fecha</th>
                                <th>Usuario</th>
                                <th>Tipo</th>
                                <th>Cant.</th>
                                <th>Motivo</th>
                            </tr>
                        </thead>
                        <tbody id="tablaKardex" style="background-color: #ffffff;"></tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
</div>
