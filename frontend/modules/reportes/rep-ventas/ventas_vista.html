<div class="content-header pt-4">
    <div class="container-fluid">
        <div class="row mb-2 align-items-center">
            <div class="col-sm-6">
                <h1 class="m-0 font-weight-bold" style="font-size: 2.2rem; color: #0f172a;">
                    <i class="fas fa-chart-line text-primary mr-2"></i> Reporte Detallado de Ventas
                </h1>
            </div>
        </div>
    </div>
</div>

<section class="content mt-3">
    <div class="container-fluid">
        <div class="card shadow-sm border-0 mb-4" style="border-radius: 8px;">
            <div class="card-body py-3">
                <form id="frmFiltrosVentas" class="row align-items-end">
                    <div class="col-md-2">
                        <label class="small font-weight-bold text-muted mb-1">Fecha Inicio</label>
                        <input type="date" class="form-control form-control-sm" id="txtFechaInicio" required>
                    </div>
                    <div class="col-md-2">
                        <label class="small font-weight-bold text-muted mb-1">Fecha Fin</label>
                        <input type="date" class="form-control form-control-sm" id="txtFechaFin" required>
                    </div>
                    <div class="col-md-2">
                        <label class="small font-weight-bold text-muted mb-1">Estado</label>
                        <select class="form-control form-control-sm" id="cboEstado">
                            <option value="TODAS">Todas</option>
                            <option value="COMPLETADA" selected>Completada</option>
                            <option value="ANULADA">Anulada</option>
                        </select>
                    </div>
                    <div class="col-md-2">
                        <label class="small font-weight-bold text-muted mb-1">Método de Pago</label>
                        <select class="form-control form-control-sm" id="cboMetodoPago">
                            <option value="TODOS">Todos</option>
                            <option value="Efectivo">Solo Efectivo</option>
                            <option value="Yape">Solo Yape</option>
                            <option value="Tarjeta">Solo Tarjeta</option>
                            <option value="MIXTO">Pagos Mixtos</option>
                        </select>
                    </div>
                    <div class="col-md-4 text-right mt-3 mt-md-0">
                        <button type="submit" class="btn btn-primary font-weight-bold shadow-sm px-3">
                            <i class="fas fa-search mr-1"></i> Generar
                        </button>
                        <button type="button" class="btn btn-outline-danger font-weight-bold shadow-sm px-3 ml-2"
                            id="btnExportarPDF" disabled>
                            <i class="fas fa-file-pdf mr-1"></i> PDF
                        </button>
                        <button type="button" class="btn btn-outline-success font-weight-bold shadow-sm px-3 ml-2"
                            id="btnExportarExcel" disabled>
                            <i class="fas fa-file-excel mr-1"></i> Excel
                        </button>
                    </div>
                </form>
            </div>
        </div>

        <div class="row" id="zonaKPIsVentas"></div>

        <div class="card shadow-sm border-0" style="border-radius: 8px;">
            <div
                class="card-header bg-white border-bottom py-3 d-flex justify-content-between align-items-center flex-wrap">
                <h3 class="card-title font-weight-bold text-muted mb-0"><i class="fas fa-list-ol mr-2"></i> Detalle de
                    Ventas</h3>
                <div class="input-group input-group-sm" style="width: 300px;">
                    <input type="text" id="txtBusquedaRapida" class="form-control"
                        placeholder="Buscar N° Doc o Cliente...">
                    <div class="input-group-append">
                        <span class="input-group-text"><i class="fas fa-search"></i></span>
                    </div>
                </div>
            </div>
            <div class="card-body p-0">
                <div class="table-responsive bg-white" style="max-height: 400px; overflow-y: auto;">
                    <table class="table table-hover table-bordered table-sm text-center mb-0"
                        style="font-size: 0.85rem;" id="tablaVentasDetalle">
                        <thead style="background-color: #1e293b; color: white; position: sticky; top: 0; z-index: 1;">
                            <tr>
                                <th style="width: 5%;"></th>
                                <th style="width: 15%;">N° Doc</th>
                                <th style="width: 15%;">Fecha</th>
                                <th style="width: 25%;">Cliente</th>
                                <th style="width: 10%;">Estado</th>
                                <th style="width: 15%;">Método(s)</th>
                                <th style="width: 15%;">Total (S/)</th>
                            </tr>
                        </thead>
                        <tbody id="cuerpoTablaVentas">
                            <tr>
                                <td colspan="7" class="text-muted py-4"><i
                                        class="fas fa-info-circle mr-2"></i>Seleccione fechas y filtros para generar el
                                    reporte.</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
            <div class="card-footer bg-white border-top d-flex justify-content-between align-items-center py-2">
                <span class="small text-muted font-weight-bold" id="txtTotalRegistros">Total: 0 ventas
                    encontradas</span>
                <span class="small text-muted" id="txtUltimaConsulta"></span>
            </div>
        </div>
    </div>

    <style>
        .tr-detalle {
            background-color: #f8fafc;
        }

        .tr-detalle td {
            border-top: none;
            padding-top: 0;
            padding-bottom: 0;
        }

        .btn-toggle-detalle {
            cursor: pointer;
            color: #3b82f6;
            transition: transform 0.2s;
        }

        .btn-toggle-detalle.open {
            transform: rotate(90deg);
        }
    </style>
</section>
