<div class="content-header pt-4">
    <div class="container-fluid d-flex justify-content-between align-items-center">
        <h1 class="m-0 font-weight-bold" style="font-size: 2.2rem; color: #0f172a;">Reportes</h1>
        <!-- <button class="btn btn-warning font-weight-bold shadow-sm"
            style="color: #451a03; background-color: #facc15; border: none;">
            <i class="far fa-question-circle mr-1"></i> Ayuda
        </button> -->
    </div>
</div>

<section class="content mt-3">
    <div class="container-fluid">
        <div class="card shadow-sm border-0 mb-4" style="border-radius: 8px;">
            <div class="card-header bg-white border-bottom pt-3 pb-3">
                <h6 class="m-0 font-weight-bold" style="color: #334155;">
                    <i class="fas fa-sliders-h mr-2" style="color: #0ea5e9;"></i> Configuración del reporte
                </h6>
            </div>

            <div class="card-body bg-light">
                <div class="row align-items-end">
                    <div class="col-md-4 mb-3 mb-md-0">
                        <label class="small font-weight-bold text-uppercase" style="color: #64748b;">
                            <i class="fas fa-chart-bar mr-1"></i> Tipo de Reporte
                        </label>
                        <select id="cboTipoReporte" class="form-control shadow-sm"
                            style="border-radius: 6px; border: 1px solid #cbd5e1;">
                            <option value="" disabled selected>-- Seleccionar reporte --</option>

                            <optgroup label="Ventas">
                                <option value="ventas_periodo">Ventas por período</option>
                                <option value="productos_top">Productos más vendidos</option>
                                <option value="ventas_vendedor">Ventas por vendedor</option>
                                <option value="cuadre_caja">Ventas por forma de pago (Cuadre)</option>
                            </optgroup>

                            <optgroup label="Inventario">
                                <option value="inventario_actual">Inventario actual y bajo stock</option>
                                <option value="kardex_global">Movimientos de inventario</option>
                            </optgroup>

                            <optgroup label="Otros">
                                <option value="directorio_clientes">Directorio de Clientes</option>
                            </optgroup>
                        </select>
                    </div>

                    <div class="col-md-8 d-flex flex-wrap align-items-end" id="zonaFiltrosDinamicos">
                    </div>
                </div>

                <div class="mt-4 pt-3 border-top d-flex gap-2">
                    <button id="btnGenerarReporte" class="btn text-white font-weight-bold shadow-sm px-4 mr-2"
                        style="background-color: #3b82f6; border-radius: 6px;" disabled>
                        <i class="fas fa-search mr-1"></i> Generar
                    </button>
                    <button id="btnExportarPDF" class="btn text-white font-weight-bold shadow-sm px-3 mr-2"
                        style="background-color: #f87171; border-radius: 6px;" disabled>
                        <i class="far fa-file-pdf mr-1"></i> Exportar PDF
                    </button>
                    <button id="btnExportarExcel" class="btn text-white font-weight-bold shadow-sm px-3"
                        style="background-color: #34d399; border-radius: 6px;" disabled>
                        <i class="far fa-file-excel mr-1"></i> Exportar Excel
                    </button>
                </div>
            </div>
        </div>

        <div class="card shadow-sm border-0" style="border-radius: 8px; min-height: 400px;">
            <div class="card-body d-flex flex-column align-items-center justify-content-center" id="lienzoResultados">

                <div id="estadoVacio" class="text-center" style="opacity: 0.6;">
                    <i class="fas fa-clipboard-list mb-3" style="font-size: 4rem; color: #cbd5e1;"></i>
                    <h4 class="font-weight-bold" style="color: #475569;">Sin reporte generado</h4>
                    <p style="color: #64748b;">Selecciona un tipo de reporte, ajusta los filtros y pulsa
                        <strong>Generar</strong>.
                    </p>
                </div>

                <div id="contenedorReporte" class="w-100 d-none">
                    <div class="row mb-4" id="zonaKPIs"></div>
                    <div class="table-responsive" id="zonaTabla"></div>
                </div>

            </div>
        </div>
    </div>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.28/jspdf.plugin.autotable.min.js"></script>
</section>
