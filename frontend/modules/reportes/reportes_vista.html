<div class="content-header pt-4">
    <div class="container-fluid">
        <h1 class="m-0 font-weight-bold" style="font-size: 2.2rem; color: #0f172a;">
            <i class="fas fa-chart-line text-primary mr-2"></i> Reportes Financieros
        </h1>
    </div>
</div>

<section class="content mt-3">
    <div class="container-fluid">

        <div class="card shadow-sm border-0" style="border-radius: 8px;">

            <div class="card-header bg-white border-bottom py-3">
                <div class="row align-items-end">

                    <div class="col-md-3 mb-2 mb-md-0">
                        <label class="small font-weight-bold text-muted mb-1">Tipo de Reporte</label>
                        <select id="cboTipoReporte" class="form-control form-control-sm shadow-none"
                            style="border-radius: 4px; border-color: #cbd5e1;">
                            <option value="" disabled selected>-- Seleccione un reporte --</option>
                            <optgroup label="Finanzas y Cajas">
                                <option value="totalizado_ventas">Totalizado Ingresos/Egresos</option>
                                <option value="cuadre_caja">Cuadre de Caja Diario</option>
                            </optgroup>
                            <optgroup label="Ventas">
                                <option value="ventas_periodo">Ventas por Período</option>
                                <option value="productos_top">Productos Más Vendidos</option>
                                <option value="ventas_vendedor">Rendimiento por Vendedores</option>
                            </optgroup>
                            <optgroup label="Inventario y Clientes">
                                <option value="inventario_actual">Valorización de Inventario</option>
                                <option value="kardex_global">Kardex Global</option>
                                <option value="directorio_clientes">Directorio de Clientes</option>
                            </optgroup>
                        </select>
                    </div>

                    <div class="col-md-4 mb-2 mb-md-0 d-flex gap-2" id="zonaFiltrosDinamicos"></div>

                    <div class="col-md-5 text-right mt-3 mt-md-0">
                        <button id="btnGenerarReporte" class="btn btn-primary btn-sm px-3 font-weight-bold mr-1"
                            disabled>
                            <i class="fas fa-search"></i> Consultar
                        </button>
                        <button id="btnExportarPDF" class="btn btn-danger btn-sm px-3 font-weight-bold mr-1" disabled>
                            <i class="far fa-file-pdf"></i> PDF
                        </button>
                        <button id="btnExportarExcel" class="btn btn-success btn-sm px-3 font-weight-bold" disabled>
                            <i class="far fa-file-excel"></i> Excel
                        </button>
                    </div>

                </div>
            </div>

            <div class="card-body p-0 bg-light">

                <div id="estadoVacio" class="text-center py-5">
                    <i class="fas fa-table mb-3" style="font-size: 3.5rem; color: #cbd5e1;"></i>
                    <h5 class="font-weight-bold" style="color: #475569;">Panel de Consultas</h5>
                    <p class="text-muted small">Seleccione un reporte y aplique los filtros para visualizar la
                        información comercial.</p>
                </div>

                <div id="contenedorReporte" class="d-none">

                    <div class="row px-3 pt-3 pb-2 mx-0 bg-white border-bottom" id="zonaKPIs"></div>

                    <div class="table-responsive bg-white" style="max-height: 500px; overflow-y: auto;">
                        <table class="table table-hover table-bordered table-sm text-center mb-0"
                            style="font-size: 0.85rem;" id="tablaPrincipal">
                            <thead
                                style="background-color: #1e293b; color: white; position: sticky; top: 0; z-index: 1;"
                                id="cabeceraTabla"></thead>
                            <tbody id="cuerpoTabla"></tbody>
                        </table>
                    </div>

                    <div class="card-footer bg-white border-top d-flex justify-content-between align-items-center py-2">
                        <span class="small text-muted font-weight-bold" id="txtTotalRegistros">Total: 0 registros</span>
                        <span class="small text-muted" id="txtUltimaConsulta"></span>
                    </div>

                </div>
            </div>

        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.28/jspdf.plugin.autotable.min.js"></script>
</section>
