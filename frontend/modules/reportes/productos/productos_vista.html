<div class="content-header pt-4">
    <div class="container-fluid">
        <div class="row mb-2 align-items-center">
            <div class="col-sm-6">
                <h1 class="m-0 font-weight-bold" style="font-size: 2.2rem; color: #0f172a;">
                    <i class="fas fa-boxes text-primary mr-2"></i> Inventario y Top Productos
                </h1>
            </div>
        </div>
    </div>
</div>

<section class="content mt-3">
    <div class="container-fluid">
        <div class="card shadow-sm border-0 mb-4" style="border-radius: 8px;">
            <div class="card-body py-3">
                <form id="frmFiltrosInventario" class="row align-items-end">
                    <div class="col-md-2">
                        <label class="small font-weight-bold text-muted mb-1">Fecha Inicio (Ventas)</label>
                        <input type="date" class="form-control form-control-sm" id="txtFechaInicioInv" required>
                    </div>
                    <div class="col-md-2">
                        <label class="small font-weight-bold text-muted mb-1">Fecha Fin (Ventas)</label>
                        <input type="date" class="form-control form-control-sm" id="txtFechaFinInv" required>
                    </div>
                    <div class="col-md-2">
                        <label class="small font-weight-bold text-muted mb-1">Categoría</label>
                        <select class="form-control form-control-sm" id="cboCategoriaInv">
                            <option value="TODAS" selected>Todas las Categorías</option>
                        </select>
                    </div>
                    <div class="col-md-2">
                        <label class="small font-weight-bold text-muted mb-1">Estado Stock</label>
                        <select class="form-control form-control-sm" id="cboEstadoStock">
                            <option value="TODOS" selected>Todos</option>
                            <option value="AGOTADO">Agotados</option>
                            <option value="BAJO">Stock Bajo (≤ 5)</option>
                            <option value="OK">Stock Saludable</option>
                        </select>
                    </div>
                    <div class="col-md-4 text-right mt-3 mt-md-0">
                        <button type="submit" class="btn btn-primary font-weight-bold shadow-sm px-3">
                            <i class="fas fa-search mr-1"></i> Buscar
                        </button>
                        <button type="button" class="btn btn-outline-danger font-weight-bold shadow-sm px-3 ml-2"
                            id="btnExportarPDFInv" disabled>
                            <i class="fas fa-file-pdf mr-1"></i> PDF
                        </button>
                        <button type="button" class="btn btn-outline-success font-weight-bold shadow-sm px-3 ml-2"
                            id="btnExportarExcelInv" disabled>
                            <i class="fas fa-file-excel mr-1"></i> Excel
                        </button>
                    </div>
                </form>
            </div>
        </div>

        <div class="row" id="zonaKPIsInventario"></div>

        <div class="card shadow-sm border-0" style="border-radius: 8px;">
            <div
                class="card-header bg-white border-bottom py-3 d-flex justify-content-between align-items-center flex-wrap">
                <h3 class="card-title font-weight-bold text-muted mb-0"><i class="fas fa-table mr-2"></i> Resultados del
                    Inventario</h3>
                <div class="input-group input-group-sm" style="width: 300px;">
                    <input type="text" id="txtBusquedaInv" class="form-control" placeholder="Buscar por producto...">
                    <div class="input-group-append">
                        <span class="input-group-text"><i class="fas fa-search"></i></span>
                    </div>
                </div>
            </div>
            <div class="card-body p-0">
                <div class="table-responsive bg-white" style="max-height: 500px; overflow-y: auto;">
                    <table class="table table-hover table-bordered table-sm text-center mb-0"
                        style="font-size: 0.85rem;">
                        <thead style="background-color: #1e293b; color: white; position: sticky; top: 0; z-index: 1;">
                            <tr>
                                <th style="width: 5%;">Pos.</th>
                                <th style="width: 35%;">Producto</th>
                                <th style="width: 15%;">Categoría</th>
                                <th style="width: 15%;">Ventas (Unds)</th>
                                <th style="width: 15%;">Stock Actual</th>
                                <th style="width: 15%;">Estado</th>
                            </tr>
                        </thead>
                        <tbody id="cuerpoTablaInventario">
                            <tr>
                                <td colspan="6" class="text-muted py-4"><i
                                        class="fas fa-info-circle mr-2"></i>Seleccione filtros para ver el inventario.
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
            <div class="card-footer bg-white border-top d-flex justify-content-between align-items-center py-2">
                <span class="small text-muted font-weight-bold" id="txtTotalInv">Total: 0 productos</span>
                <span class="small text-muted" id="txtUltimaConsultaInv"></span>
            </div>
        </div>
    </div>
</section>
