<script>
    if (!document.getElementById("app-content")) {
        window.location.replace("../../index.html");
    }
</script>

<div class="content-header pt-4">
    <div class="container-fluid">
        <div>
            <h1 class="m-0 dato-critico" style="font-size: 2.2rem;">Configuración de la Empresa</h1>
            <small class="font-weight-bold" style="color: var(--fox-text-gray);">Gestión de datos maestros e identidad
                corporativa</small>
        </div>
    </div>
</div>

<section class="content mt-3">
    <div class="container-fluid">
        <div class="card shadow-sm" style="border-radius: 12px; overflow: hidden;">
            <div class="card-header bg-white border-bottom p-3">
                <h5 class="m-0 font-weight-bold text-dark">
                    <i class="fas fa-building mr-2 text-info"></i> Perfil Corporativo Fox Gamers
                </h5>
            </div>

            <div class="card-body p-4" style="background-color: #f8fafc;">
                <form id="formEmpresa" autocomplete="off">
                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label class="small font-weight-bold text-uppercase text-secondary">R.U.C. (11
                                dígitos)</label>
                            <div class="input-group">
                                <input type="text" id="empRuc" class="form-control font-weight-bold" maxlength="11"
                                    placeholder="Ej. 20123456789" required disabled style="box-shadow: none;">
                                <div class="input-group-append">
                                    <button class="btn btn-dark font-weight-bold" type="button" id="btnConsultarRuc"
                                        disabled>
                                        <i class="fas fa-search-dollar mr-1"></i> Consultar
                                    </button>
                                </div>
                            </div>
                        </div>

                        <div class="col-md-6 mb-3">
                            <label class="small font-weight-bold text-uppercase text-secondary">Razón Social</label>
                            <input type="text" id="empRazonSocial" class="form-control"
                                placeholder="Ej. FOX GAMERS S.A.C." required disabled>
                        </div>

                        <div class="col-md-12 mb-3">
                            <label class="small font-weight-bold text-uppercase text-secondary">Nombre Comercial (Se
                                lucirá en Boletas/Web)</label>
                            <input type="text" id="empNombreComercial" class="form-control font-weight-bold"
                                placeholder="Ej. FOX GAMERS" required disabled>
                        </div>

                        <div class="col-md-12 mb-3">
                            <label class="small font-weight-bold text-uppercase text-secondary">Dirección Fiscal /
                                Oficina Central</label>
                            <input type="text" id="empDireccion" class="form-control"
                                placeholder="Ej. Av. Principal 123, Chiclayo - Perú" required disabled>
                        </div>

                        <div class="col-md-4 mb-3">
                            <label class="small font-weight-bold text-uppercase text-secondary">Teléfono / WhatsApp de
                                Contacto</label>
                            <input type="text" id="empTelefono" class="form-control" placeholder="Ej. +51 961 460 326"
                                disabled>
                        </div>

                        <div class="col-md-4 mb-3">
                            <label class="small font-weight-bold text-uppercase text-secondary">Correo de Ventas /
                                Soporte</label>
                            <input type="email" id="empCorreo" class="form-control"
                                placeholder="Ej. ventas@foxgamers.pe" disabled>
                        </div>

                        <div class="col-md-4 mb-3">
                            <label class="small font-weight-bold text-uppercase text-secondary">Sitio Web URL</label>
                            <input type="text" id="empWeb" class="form-control" placeholder="Ej. foxgamers.pe" disabled>
                        </div>
                    </div>

                    <div class="hr-border my-3" style="border-top: 1px solid #e2e8f0;"></div>

                    <div class="d-flex justify-content-end align-items-center">
                        <button type="button" id="btnEditarToggle" class="btn font-weight-bold shadow-sm px-4 py-2 mr-2"
                            style="background-color: #eab308; color: white; border-radius: 8px;">
                            <i class="fas fa-edit mr-2"></i> Editar
                        </button>

                        <button type="submit" id="btnGuardarEmpresa"
                            class="btn font-weight-bold shadow-sm px-4 py-2 d-none"
                            style="background-color: var(--fox-orange); color: white; border-radius: 8px;">
                            <i class="fas fa-save mr-2"></i> Guardar Cambios Globales
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</section>
