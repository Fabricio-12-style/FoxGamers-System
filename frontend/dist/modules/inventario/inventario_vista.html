<script>
    if (!document.getElementById("app-content")) {
        window.location.replace("../../index.html");
    }

<div class="content-header pt-4">
    <div class="container-fluid d-flex justify-content-between align-items-center">
        <h1 class="m-0 dato-critico" style="font-size: 2.2rem;">Gestión de Inventario</h1>
    </div>
</div>

<section class="content mt-3">
    <div class="container-fluid">
        <div class="card shadow-sm border-0">
            <div
                class="card-header border-bottom-0 pt-3 pb-3 bg-light d-flex justify-content-between align-items-center">
                <div class="input-group w-50">
                    <div class="input-group-prepend">
                        <span class="input-group-text bg-white text-muted"><i class="fas fa-search"></i></span>
                    </div>
                    <input type="text" id="buscarInventario" class="form-control"
                        placeholder="Escribe el modelo base o atributo del producto para buscar en el hosting...">
                </div>
                <span class="badge badge-secondary p-2" style="font-size: 0.85rem;"
                    id="lblModoCargaInventario">Mostrando últimos 5</span>
            </div>

            <div class="card-body p-0 table-responsive">
                <table class="table table-striped text-center align-middle mb-0 w-100">
                    <thead style="background-color: #1e293b; color: white; position: sticky; top: 0; z-index: 1;">
                        <tr>
                            <th style="width: 50px; min-width: 50px;" class="d-table-cell d-md-none border-0"></th>
                            <th class="d-none d-md-table-cell">Imagen</th>
                            <th class="text-left border-0">Producto</th>
                            <th class="text-left d-none d-md-table-cell">Presentación</th>
                            <th class="d-none d-md-table-cell">Stock Actual</th>
                            <th class="d-none d-md-table-cell">Stock Mín.</th>
                            <th class="d-none d-md-table-cell">P. Compra</th>
                            <th class="d-none d-md-table-cell">P. Venta</th>
                            <th class="d-none d-md-table-cell">Estado</th>
                            <th class="d-none d-md-table-cell">Acciones</th>
                        </tr>
                    </thead>
                    <tbody id="tablaInventario"></tbody>
                </table>
            </div>
        </div>
    </div>
</section>

<div class="modal fade" id="modalAjusteStock" tabindex="-1" data-backdrop="static" data-keyboard="false">
    <div class="modal-dialog modal-dialog-centered modal-md">
        <div class="modal-content shadow-lg border-0">
            <div class="modal-header py-2"
                style="background-color: var(--fox-surface); border-bottom: 3px solid var(--fox-cyan) !important;">
                <h5 class="modal-title font-weight-bold m-0" style="color: var(--fox-text-light); font-size: 1.1rem;">
                    <i class="fas fa-boxes mr-2" style="color: var(--fox-cyan);"></i> Movimiento de Stock
                </h5>
                <button type="button" class="close text-white" data-dismiss="modal">&times;</button>
            </div>

            <form id="formAjusteStock">
                <div class="modal-body p-3 bg-white">
                    <div class="text-center mb-2 p-2 rounded"
                        style="border: 2px dashed var(--fox-cyan); background-color: #f8fafc;">
                        <small class="text-uppercase font-weight-bold d-block mb-1"
                            style="color: var(--fox-text-gray); font-size: 0.7rem;">Producto a modificar:</small>
                        <h6 id="lblProductoAjuste" class="dato-critico mb-1"
                            style="color: var(--fox-cyan) !important; font-size: 1rem;">Cargando...</h6>
                        <div class="small font-weight-bold" style="color: var(--fox-text-gray);">
                            Stock Actual: <strong id="lblStockActualAjuste" class="dato-critico text-danger"
                                style="font-size: 1.1rem;">0</strong>
                        </div>
                    </div>

                    <div class="row">
                        <div class="col-sm-6 mb-2">
                            <label class="small font-weight-bold text-uppercase mb-1"
                                style="color: var(--fox-text-gray);">Tipo *</label>
                            <select id="ajusteTipo" class="form-control form-control-sm" required>
                                <option value="" disabled selected>-- Seleccione --</option>
                                <option value="ENTRADA" class="text-success font-weight-bold">ENTRADA (+)</option>
                                <option value="SALIDA" class="text-danger font-weight-bold">SALIDA (-)</option>
                            </select>
                        </div>
                        <div class="col-sm-6 mb-2">
                            <label class="small font-weight-bold text-uppercase mb-1"
                                style="color: var(--fox-text-gray);">Motivo *</label>
                            <select id="ajusteMotivoSelect" class="form-control form-control-sm" required disabled>
                                <option value="" disabled selected>-- Elija un Tipo --</option>
                            </select>
                        </div>
                    </div>

                    <div id="divAjusteProveedor" class="mb-2 d-none">
                        <label class="small font-weight-bold text-uppercase mb-1"
                            style="color: var(--fox-text-gray);">Proveedor *</label>
                        <select id="ajusteProveedorSelect" class="form-control form-control-sm">
                            <option value="" disabled selected>-- Seleccione Proveedor --</option>
                        </select>
                    </div>

                    <div class="row">
                        <div class="col-6 mb-2">
                            <label class="small font-weight-bold text-uppercase mb-1"
                                style="color: var(--fox-text-gray);">Cant. *</label>
                            <input type="number" id="ajusteCantidad"
                                class="form-control form-control-sm text-center dato-critico" min="1"
                                placeholder="Ej: 5" required>
                        </div>
                        <div class="col-6 mb-2">
                            <label class="small font-weight-bold text-uppercase mb-1"
                                style="color: var(--fox-text-gray);">N° Doc</label>
                            <input type="text" id="ajusteDocumento"
                                class="form-control form-control-sm font-weight-bold" placeholder="(Opcional)">
                        </div>
                    </div>

                    <div class="mb-1">
                        <label class="small font-weight-bold text-uppercase mb-1"
                            style="color: var(--fox-text-gray);">Observación</label>
                        <textarea id="ajusteObservacion" class="form-control form-control-sm font-weight-bold" rows="1"
                            placeholder="Detalles..."></textarea>
                    </div>
                </div>

                <div class="modal-footer py-2 border-top-0" style="background-color: var(--fox-surface);">
                    <button type="button" class="btn btn-sm btn-secondary font-weight-bold px-3"
                        data-dismiss="modal">Cancelar</button>
                    <button type="submit" class="btn btn-sm btn-fox px-3">
                        <i class="fas fa-save mr-1"></i> Guardar
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>

    <div class="modal-dialog modal-dialog-centered modal-lg">
