<script>
    if (!document.getElementById("app-content")) {
        window.location.replace("../../index.html");
    }
</script>

<div class="content-header pt-4">
    <div class="container-fluid d-flex justify-content-between align-items-center flex-wrap gap-2">
        <h1 class="m-0 dato-critico" style="font-size: 2.2rem;">Gestión de Perfiles</h1>
        <button class="btn btn-fox shadow-sm px-4 btn-crear-perfil-mobile" onclick="abrirModalCrear()">
            <i class="fas fa-plus-circle mr-1"></i> Crear Nuevo Perfil
        </button>
    </div>
</div>

<section class="content mt-3">
    <div class="container-fluid">
        <div class="card shadow-sm border-0">
            <div class="card-header border-bottom-0 pt-3 pb-3 bg-light">
                <div class="input-group w-100" style="max-width: 420px;">
                    <input type="text" id="busquedaPerfil" class="form-control"
                        placeholder="Buscar perfil por nombre...">
                    <div class="input-group-append">
                        <span class="input-group-text"
                            style="background-color: var(--fox-surface); border-color: #cbd5e1; color: var(--fox-cyan);">
                            <i class="fas fa-search"></i>
                        </span>
                    </div>
                </div>
            </div>
            <div class="card-body p-0 table-responsive">
                <table class="table table-striped text-center align-middle mb-0 w-100">
                    <thead>
                        <tr>
                            <th style="width: 48px; min-width: 48px;" class="d-table-cell d-md-none border-0"></th>
                            <th class="d-none d-md-table-cell">ID</th>
                            <th class="text-left border-0">Nombre del Perfil</th>
                            <th class="d-none d-md-table-cell">Descripción</th>
                            <th class="d-none d-md-table-cell">Estado</th>
                            <th class="d-none d-md-table-cell">Fecha Creación</th>
                            <th class="d-none d-md-table-cell">Acciones</th>
                        </tr>
                    </thead>
                    <tbody id="tablaPerfiles">
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</section>

<div class="modal fade" id="modalCrearPerfil" tabindex="-1" data-backdrop="static" data-keyboard="false">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content shadow-lg border-0">
            <div class="modal-header"
                style="background-color: var(--fox-surface); border-bottom: 3px solid var(--fox-cyan) !important;">
                <h5 class="modal-title font-weight-bold m-0" style="color: var(--fox-text-light);">
                    <i class="fas fa-user-plus mr-2" style="color: var(--fox-cyan);"></i> Nuevo Perfil
                </h5>
                <button type="button" class="close" data-dismiss="modal"
                    style="color: var(--fox-text-light); opacity: 0.8;">&times;</button>
            </div>
            <form id="formCrearPerfil">
                <div class="modal-body p-4 bg-white">
                    <div class="form-group mb-3">
                        <label class="small font-weight-bold text-uppercase mb-1"
                            style="color: var(--fox-text-gray);">Nombre del Rol Comercial *</label>
                        <select id="nuevoPerfNombre" class="form-control dato-critico" required>
                            <option value="" disabled selected>-- Selecciona un Rol Autorizado --</option>
                            <option value="Administrador">Administrador (Acceso Global)</option>
                            <option value="Supervisor">Supervisor de Tienda</option>
                            <option value="Vendedor">Vendedor / Cajero</option>
                            <option value="Almacenero">Almacenero / Logística</option>
                            <option value="Soporte Tecnico">Soporte Técnico de Hardware</option>
                        </select>
                    </div>
                    <div class="form-group mb-0">
                        <label class="small font-weight-bold text-uppercase mb-1"
                            style="color: var(--fox-text-gray);">Descripción de Funciones *</label>
                        <textarea id="nuevoPerfDesc" class="form-control font-weight-bold" rows="3"
                            placeholder="Define las responsabilidades..."></textarea>
                    </div>
                </div>
                <div class="modal-footer px-3 px-sm-4 border-top-0 flex-column flex-sm-row"
                    style="background-color: var(--fox-surface);">
                    <button type="button"
                        class="btn btn-secondary font-weight-bold mr-0 mr-sm-2 mb-2 mb-sm-0 w-100 w-sm-auto"
                        data-dismiss="modal">Cancelar</button>
                    <button type="submit" class="btn btn-fox px-4 w-100 w-sm-auto"><i class="fas fa-save mr-2"></i>
                        Registrar
                        Perfil</button>
                </div>
            </form>
        </div>
    </div>
</div>

<div class="modal fade" id="modalEditarPerfil" tabindex="-1" data-backdrop="static" data-keyboard="false">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content shadow-lg border-0">
            <div class="modal-header"
                style="background-color: var(--fox-surface); border-bottom: 3px solid var(--fox-orange) !important;">
                <h5 class="modal-title font-weight-bold m-0" style="color: var(--fox-text-light);">
                    <i class="fas fa-edit mr-2" style="color: var(--fox-orange);"></i> Editar Perfil
                </h5>
                <button type="button" class="close" data-dismiss="modal"
                    style="color: var(--fox-text-light); opacity: 0.8;">&times;</button>
            </div>
            <form id="formEditarPerfil">
                <div class="modal-body p-4 bg-white">
                    <div class="form-group mb-3">
                        <label class="small font-weight-bold text-uppercase mb-1"
                            style="color: var(--fox-text-gray);">Nombre del Rol Comercial *</label>
                        <select id="editPerfNombre" class="form-control dato-critico" required>
                            <option value="Administrador">Administrador (Acceso Global)</option>
                            <option value="Supervisor">Supervisor de Tienda</option>
                            <option value="Vendedor">Vendedor / Cajero</option>
                            <option value="Almacenero">Almacenero / Logística</option>
                            <option value="Soporte Tecnico">Soporte Técnico de Hardware</option>
                        </select>
                    </div>
                    <div class="form-group mb-0">
                        <label class="small font-weight-bold text-uppercase mb-1"
                            style="color: var(--fox-text-gray);">Descripción de Funciones *</label>
                        <textarea id="editPerfDesc" class="form-control font-weight-bold" rows="3"></textarea>
                    </div>
                </div>
                <div class="modal-footer px-3 px-sm-4 border-top-0 flex-column flex-sm-row"
                    style="background-color: var(--fox-surface);">
                    <button type="button"
                        class="btn btn-secondary font-weight-bold mr-0 mr-sm-2 mb-2 mb-sm-0 w-100 w-sm-auto"
                        data-dismiss="modal">Cancelar</button>
                    <button type="submit" class="btn btn-fox px-4 w-100 w-sm-auto"><i class="fas fa-save mr-2"></i>
                        Guardar
                        Cambios</button>
                </div>
            </form>
        </div>
    </div>
</div>

<div class="modal fade" id="modalPermisos" tabindex="-1" data-backdrop="static" data-keyboard="false">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content shadow-lg border-0">
            <div class="modal-header"
                style="background-color: var(--fox-surface); border-bottom: 3px solid var(--fox-cyan) !important;">
                <h5 class="modal-title font-weight-bold m-0" style="color: var(--fox-text-light);">
                    <i class="fas fa-shield-alt mr-2" style="color: var(--fox-cyan);"></i> Configurar Accesos
                </h5>
                <button type="button" class="close" data-dismiss="modal"
                    style="color: var(--fox-text-light); opacity: 0.8;">&times;</button>
            </div>
            <div class="modal-body p-4 bg-white">
                <div class="text-center mb-4 p-3 rounded"
                    style="background-color: #f8fafc; border: 1px dashed #cbd5e1;">
                    <h6 id="lblPermisoTitulo" class="dato-critico text-dark mb-2">Nombre del Perfil</h6>
                    <span id="lblPermisoRol" class="badge px-3 py-2 shadow-sm">ROL</span>
                </div>
                <form id="formGestionPermisos">
                    <p class="small font-weight-bold text-uppercase mb-3" style="color: var(--fox-text-gray);">
                        Selecciona los módulos permitidos:</p>
                    <div class="row" id="contenedorPermisos">
                    </div>
                </form>
            </div>
            <div class="modal-footer px-3 px-sm-4 border-top-0 flex-column flex-sm-row"
                style="background-color: var(--fox-surface);">
                <button type="button"
                    class="btn btn-secondary font-weight-bold mr-0 mr-sm-2 mb-2 mb-sm-0 w-100 w-sm-auto"
                    data-dismiss="modal">Cancelar</button>
                <button type="submit" form="formGestionPermisos" class="btn btn-fox px-4 w-100 w-sm-auto">
                    <i class="fas fa-check-circle mr-2"></i> Guardar Permisos
                </button>
            </div>
        </div>
    </div>
</div>
