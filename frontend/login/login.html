<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acceso - FOX GAMERS</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../shared/css/login.css">
    <link rel="sytlesheet" href="../shared/css/fox-style.css">
    <style>
        body {
            overflow: hidden !important;
            font-family: 'Quicksand', sans-serif;
        }
    </style>
</head>

<body class="vh-100 d-flex flex-row justify-content-center align-items-center bg-fox-dark">
    <div class="container-fluid m-0 p-0 h-100">
        <div class="row h-100 m-0">

            <div
                class="col-12 col-lg-5 d-flex flex-column justify-content-center align-items-center text-light left-hud-panel">
                <div class="text-center">
                    <img class="rounded-circle mb-4 shadow-lg" src="../shared/img/foxGamers.jpeg" alt="Logo Fox Gamers"
                        style="width: 140px; border: 2px solid rgba(255, 0, 85, 0.4); box-shadow: 0 0 25px rgba(255, 0, 85, 0.2) !important;">
                    <p class="h1 font-weight-bold mb-0"
                        style="letter-spacing: 2px; text-shadow: 0 0 10px rgba(255,255,255,0.1);">FOX GAMERS</p>
                    <p class="h6 font-weight-light text-muted mt-2 text-uppercase" style="letter-spacing: 4px;">Sistema
                        de Gestión</p>
                </div>
            </div>

            <div class="col-12 col-lg-7 d-flex justify-content-center align-items-center p-4">
                <div class="w-100 glass-login-card p-4 p-md-5" style="max-width: 500px;">

                    <form class="needs-validation" novalidate>
                        <div class="text-center mb-4">
                            <h3 class="font-weight-bold text-white mb-1" style="letter-spacing: 1px;">Iniciar Sesión
                            </h3>
                            <p class="text-muted small">Ingresa tus credenciales de acceso</p>
                        </div>

                        <div class="form-group mb-4">
                            <label for="username" class="font-weight-bold text-muted small text-uppercase"
                                style="letter-spacing: 1px;">Usuario</label>
                            <input type="text" class="form-control login-input rounded" id="username"
                                placeholder="Nombre de usuario" required autocomplete="off">
                            <div class="invalid-feedback">Por favor, ingresa tu usuario.</div>
                        </div>

                        <div class="form-group mb-4">
                            <label for="password" class="font-weight-bold text-muted small text-uppercase"
                                style="letter-spacing: 1px;">Contraseña</label>
                            <div class="position-relative">
                                <input type="password" class="form-control login-input rounded" id="password"
                                    placeholder="••••••••" required style="padding-right: 45px;">
                                <i class="bi bi-eye text-muted position-absolute" id="togglePassword"
                                    style="top: 50%; right: 15px; transform: translateY(-50%); cursor: pointer; font-size: 1.25rem; z-index: 10; transition: color 0.2s;"></i>
                                <div class="invalid-feedback">Por favor, ingresa tu contraseña.</div>
                            </div>
                        </div>

                        <div class="mt-5">
                            <button id="btnIngresar" class="btn btn-fox-cyber btn-lg w-100 font-weight-bold py-3"
                                type="button">
                                <i class="bi bi-box-arrow-in-right mr-2"></i> Acceder al Sistema
                            </button>
                        </div>
                    </form>

                </div>
            </div>

        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/jquery@3.6.0/dist/jquery.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="./login.js"></script>
</body>

</html>
